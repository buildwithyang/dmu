[project]
name = "dmu"
version = "0.1.0"
description = "AI 学习目录，所有子项目共用根级 .venv"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.15",
    "jupyter>=1.1",
    "ipykernel>=7.4",
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
    "openai>=3.51.0",
]

# 这是一个学习工作区，不是可安装的 Python 包
[tool.uv]
package = false
